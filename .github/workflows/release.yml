name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            cpu: baseline
            artifact: sykora-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-linux
            cpu: x86_64_v3
            artifact: sykora-linux-x86_64-avx2
          - os: ubuntu-latest
            target: aarch64-linux-musl
            cpu: baseline+neon
            pie: true
            artifact: sykora-linux-aarch64
          # Zig 0.15.2 cannot link its build runner on the macOS 26 image.
          # Pin the host image until the compiler toolchain is upgraded.
          - os: macos-15
            target: x86_64-macos
            cpu: baseline
            artifact: sykora-macos-x86_64
          - os: macos-15
            target: x86_64-macos
            cpu: x86_64_v3
            artifact: sykora-macos-x86_64-avx2
          - os: macos-15
            target: aarch64-macos
            cpu: baseline
            artifact: sykora-macos-aarch64
          - os: windows-latest
            target: x86_64-windows
            cpu: baseline
            artifact: sykora-windows-x86_64
          - os: windows-latest
            target: x86_64-windows
            cpu: x86_64_v3
            artifact: sykora-windows-x86_64-avx2

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }} ${{ matrix.pie && '-Dpie' || '' }}

      - name: Verify static AArch64 PIE
        if: matrix.target == 'aarch64-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          readelf -h zig-out/bin/sykora | grep -Eq 'Type:.*DYN'
          readelf -h zig-out/bin/sykora | grep -Eq 'Machine:.*AArch64'
          if readelf -l zig-out/bin/sykora | grep -q INTERP; then
            echo 'AArch64 binary unexpectedly requires a dynamic loader' >&2
            exit 1
          fi
          if readelf -d zig-out/bin/sykora | grep -q NEEDED; then
            echo 'AArch64 binary unexpectedly requires a shared library' >&2
            exit 1
          fi

      - name: Smoke test AArch64 binary
        if: matrix.target == 'aarch64-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          printf 'uci\nisready\nquit\n' | timeout 120s qemu-aarch64 zig-out/bin/sykora > uci-smoke.txt
          grep -qx uciok uci-smoke.txt
          grep -qx readyok uci-smoke.txt

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp zig-out/bin/sykora ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp zig-out/bin/sykora.exe ${{ matrix.artifact }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # The release SPRT runs in parallel on the tag. Keep artifacts private
          # until its result has been reviewed and the draft is published.
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
